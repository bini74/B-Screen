    <rect x="900" y="150" width="230" height="34" rx="12" fill="#e4e6ec"/>
    <text x="1015" y="172" font-size="12" fill="#3c4150" text-anchor="middle" font-weight="600">Messages</text>
    <rect x="916" y="198" width="150" height="34" rx="14" fill="#e4e6ec"/>
    <rect x="964" y="242" width="150" height="34" rx="14" fill="#0a84ff"/>
    <rect x="916" y="286" width="120" height="34" rx="14" fill="#e4e6ec"/>
