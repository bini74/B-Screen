      <rect x="1056" y="540" width="104" height="66" rx="7" fill="url(#vignette)"/><text x="1108" y="626">18:05</text>
    </g>
  </g>
  <!-- Un moment privé, hachuré -->
  <defs><pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#232a3c"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4a5270" stroke-width="3"/></pattern></defs>
  <rect x="816" y="540" width="104" height="66" rx="7" fill="url(#hachures)"/>
  <text x="868" y="578" font-size="16" fill="#cfd4e0" text-anchor="middle">🔒</text>
  <!-- La barre d'activité et les voix -->
  <rect x="40" y="664" width="1120" height="8" rx="4" fill="#1f2433"/>
  <rect x="300" y="664" width="140" height="8" rx="4" fill="#2fb36b"/>
  <rect x="560" y="664" width="60" height="8" rx="4" fill="#2fb36b"/>
  <rect x="900" y="664" width="200" height="8" rx="4" fill="#9b59f6"/>
  <text x="40" y="690" font-size="11.5" fill="#8b91a0">⌥Espace pour ouvrir · ←/→ un moment · pincer pour remonter vite · Espace pour écouter · ? pour l'aide</text>
  <text x="1160" y="690" font-size="11.5" fill="#8b91a0" text-anchor="end"><tspan fill="#2fb36b">■</tspan> voix  <tspan fill="#9b59f6">■</tspan> appel</text>
</svg>
