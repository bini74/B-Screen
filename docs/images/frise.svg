    <rect x="622" y="214" width="200" height="10" rx="5" fill="#b9bdc8"/>
    <rect x="470" y="242" width="360" height="10" rx="5" fill="#b9bdc8"/>
    <rect x="470" y="262" width="300" height="10" rx="5" fill="#b9bdc8"/>
    <rect x="470" y="296" width="120" height="30" rx="8" fill="#0a84ff"/>
    <text x="530" y="316" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Contacter</text>
    <rect x="150" y="352" width="700" height="10" rx="5" fill="#d4d7df"/>
    <rect x="150" y="372" width="620" height="10" rx="5" fill="#d4d7df"/>
    <rect x="150" y="392" width="660" height="10" rx="5" fill="#d4d7df"/>
  </g>
  <g filter="url(#ombre)">
