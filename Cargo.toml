[workspace]
resolver = "3"
members = ["crates/*", "outils/icones"]
default-members = ["crates/bscreen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# Nos crates
bscreen-core = { path = "crates/bscreen-core" }
bscreen-macos = { path = "crates/bscreen-macos" }
bscreen-ui = { path = "crates/bscreen-ui" }
bscreen-store = { path = "crates/bscreen-store" }
bscreen-api = { path = "crates/bscreen-api" }

# Commun
rusqlite = { version = "0.43", features = ["bundled"] }
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

# Apple (objc2) : seulement les parties utilisées, pour compiler vite
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-av-foundation = { version = "0.3", default-features = false }
objc2-service-management = { version = "0.3", default-features = false }
objc2-screen-capture-kit = { version = "0.3", default-features = false }
objc2-core-media = { version = "0.3", default-features = false }
objc2-core-video = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
dispatch2 = "0.3"
objc2-vision = { version = "0.3", default-features = false }
objc2-avf-audio = { version = "0.3", default-features = false }
objc2-speech = { version = "0.3", default-features = false }
objc2-core-audio-types = { version = "0.3", default-features = false }
objc2-sound-analysis = { version = "0.3", default-features = false }
objc2-core-ml = { version = "0.3", default-features = false }
objc2-local-authentication = { version = "0.3", default-features = false }
objc2-core-text = { version = "0.3", default-features = false }

# Barre des menus
tray-icon = "0.26"

# Interface (essai de la phase 0.3). Sans les briques Linux, inutiles sur Mac.
gpui = { version = "0.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false }
futures = "0.3"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Les dépendances compilées optimisées même en développement : l'interface reste fluide.
[profile.dev.package."*"]
opt-level = 2
