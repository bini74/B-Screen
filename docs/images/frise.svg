    <rect x="470" y="144" width="230" height="16" rx="4" fill="#1d1f27"/>
    <rect x="470" y="172" width="380" height="10" rx="5" fill="#b9bdc8"/>
    <rect x="470" y="192" width="340" height="10" rx="5" fill="#b9bdc8"/>
