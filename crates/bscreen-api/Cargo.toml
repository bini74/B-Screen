[package]
name = "bscreen-api"
description = "Cœur portable de B-Screen pour les autres programmes : serveur MCP en lecture seule (puis API HTTP locale, export)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bscreen-core.workspace = true
bscreen-store.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "time", "net", "sync"] }
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
schemars = "1"
