    <rect x="525" y="520" width="150" height="96" rx="9" fill="#c8312f" stroke="#0a84ff" stroke-width="3.5"/>
    <rect x="535" y="530" width="60" height="38" rx="4" fill="#e8463f"/>
    <rect x="602" y="532" width="62" height="6" rx="3" fill="#f4d6d5"/><rect x="602" y="544" width="52" height="6" rx="3" fill="#f4d6d5"/>
