<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe6f3"/>
      <stop offset="1" stop-color="#c9d3e6"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b2540" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#fond)"/>
  <g filter="url(#ombre)">
    <rect x="70" y="40" width="760" height="480" rx="20" fill="#ffffff" fill-opacity="0.93"/>
  </g>
  <!-- En-tête : la question -->
  <text x="100" y="92" font-size="22" fill="#0a84ff">✦</text>
  <text x="134" y="91" font-size="19" fill="#14161c">Qu'est-ce que Camille m'a dit hier sur le serveur ?</text>
  <circle cx="666" cy="84" r="16" fill="#eef0f5"/>
  <text x="666" y="90" font-size="15" text-anchor="middle">🎙</text>
  <rect x="694" y="68" width="128" height="32" rx="16" fill="#eef0f5"/>
  <circle cx="709" cy="84" r="4" fill="#ff9f0a"/>
  <text x="718" y="89" font-size="12.5" fill="#3c4150">Claude · Équilibré ▾</text>
  <line x1="70" y1="120" x2="830" y2="120" stroke="#e3e6ee"/>
  <!-- Ce qui a été lu -->
  <text x="100" y="150" font-size="12" fill="#8b91a0">↳ échanges avec Camille, 24/11 · ↳ voix 18:02–18:40 · ↳ Messages (même nom)</text>
  <!-- La réponse -->
  <text x="100" y="186" font-size="15.5" fill="#14161c">Hier vers 18 h, au téléphone en haut-parleur, Camille t'a dit que :</text>
  <text x="112" y="216" font-size="15.5" fill="#14161c">• la sauvegarde de nuit vers Lyon <tspan font-weight="700">passait enfin</tspan> <tspan fill="#0a84ff" font-weight="600">voix 24/11 18:12</tspan></text>
  <text x="112" y="244" font-size="15.5" fill="#14161c">• qu'il fallait garder le pare-feu de Genève tel quel <tspan fill="#0a84ff" font-weight="600">voix 24/11 18:20</tspan></text>
  <text x="112" y="272" font-size="15.5" fill="#14161c">• et que la commande arrivait par Messages <tspan fill="#0a84ff" font-weight="600">écran 24/11 18:24</tspan></text>
  <!-- Les sources -->
  <text x="100" y="316" font-size="12" font-weight="700" fill="#8b91a0" letter-spacing="0.6">SOURCES</text>
  <g font-size="12">
    <rect x="100" y="330" width="220" height="150" rx="12" fill="#f2f4f8"/>
    <rect x="112" y="342" width="196" height="84" rx="8" fill="#2fb36b" fill-opacity="0.18"/>
    <path d="M140 384 q10 -24 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2fb36b" stroke-width="3"/>
    <text x="112" y="446" fill="#14161c" font-weight="600">Camille · 18:12</text>
    <text x="112" y="464" fill="#8b91a0">« la sauvegarde passe enfin »</text>
    <rect x="340" y="330" width="220" height="150" rx="12" fill="#f2f4f8"/>
    <rect x="352" y="342" width="196" height="84" rx="8" fill="#2fb36b" fill-opacity="0.18"/>
    <path d="M380 384 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2fb36b" stroke-width="3"/>
    <text x="352" y="446" fill="#14161c" font-weight="600">Camille · 18:20</text>
    <text x="352" y="464" fill="#8b91a0">« on garde Genève tel quel »</text>
    <rect x="580" y="330" width="220" height="150" rx="12" fill="#f2f4f8"/>
    <rect x="592" y="342" width="196" height="84" rx="8" fill="#ffffff"/>
    <rect x="602" y="352" width="110" height="18" rx="9" fill="#e4e6ec"/>
    <rect x="668" y="376" width="110" height="18" rx="9" fill="#0a84ff"/>
    <rect x="602" y="400" width="90" height="18" rx="9" fill="#e4e6ec"/>
    <text x="592" y="446" fill="#14161c" font-weight="600">Messages · 18:24</text>
    <text x="592" y="464" fill="#8b91a0">toucher : ouvre la frise ici</text>
  </g>
  <text x="100" y="505" font-size="12" fill="#8b91a0">6,8 s · tout ce qui part du Mac est affiché et dépliable · ⌘N : nouvelle conversation</text>
</svg>
