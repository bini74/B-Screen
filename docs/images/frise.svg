      <rect x="160" y="540" width="104" height="66" rx="7" fill="url(#vignette)"/><text x="212" y="626">17:53</text>
      <rect x="280" y="540" width="104" height="66" rx="7" fill="url(#vignette)"/><text x="332" y="626">17:54</text>
