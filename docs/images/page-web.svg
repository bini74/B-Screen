<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 860" width="460" height="860" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="halo" cx="0.15" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#1d3157"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4660"/><stop offset="1" stop-color="#232a3c"/>
    </linearGradient>
  </defs>
  <!-- Le téléphone -->
  <rect x="10" y="10" width="440" height="840" rx="64" fill="#050608"/>
  <rect x="24" y="24" width="412" height="812" rx="52" fill="url(#halo)"/>
  <rect x="170" y="38" width="120" height="32" rx="16" fill="#050608"/>
  <!-- En-tête -->
  <rect x="48" y="96" width="34" height="34" rx="9" fill="#2d5bd8"/>
  <text x="65" y="119" font-size="16" fill="#fff" text-anchor="middle">⏪</text>
  <text x="94" y="121" font-size="22" font-weight="700" fill="#eef0f5">B-Screen</text>
  <text x="412" y="121" font-size="12" fill="#727887" text-anchor="end">3 endroits · 41 ms</text>
  <!-- Le champ -->
  <rect x="44" y="146" width="372" height="56" rx="28" fill="#1c2030" stroke="#2c3244"/>
  <circle cx="74" cy="173" r="8" fill="none" stroke="#727887" stroke-width="2.3"/>
  <line x1="80" y1="179" x2="86" y2="185" stroke="#727887" stroke-width="2.3" stroke-linecap="round"/>
  <text x="98" y="180" font-size="18" fill="#eef0f5">la facture d'électricité</text>
  <circle cx="390" cy="174" r="20" fill="#ff3b30"/>
  <rect x="385" y="163" width="10" height="16" rx="5" fill="#fff"/>
  <path d="M380 174 a10 10 0 0 0 20 0" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- Les cartes -->
  <g font-size="12">
    <rect x="44" y="222" width="372" height="116" rx="18" fill="#1c2030" stroke="#2c3244"/>
    <rect x="56" y="234" width="120" height="76" rx="10" fill="url(#v)"/>
    <rect x="66" y="246" width="70" height="8" rx="4" fill="#cfd4e0"/><rect x="66" y="262" width="92" height="6" rx="3" fill="#727887"/><rect x="66" y="274" width="80" height="6" rx="3" fill="#727887"/>
    <text x="188" y="248" fill="#eef0f5" font-weight="600">Safari <tspan fill="#727887" font-weight="400">lun. 23/11 21:15</tspan></text>
    <text x="188" y="268" fill="#eef0f5" font-size="13.5" font-weight="600">Espace client — Factures</text>
    <text x="188" y="288" fill="#a3a9b7">…votre facture d'électricité de</text>
    <text x="188" y="304" fill="#a3a9b7">novembre est disponible…</text>
    <rect x="188" y="314" width="70" height="18" rx="9" fill="#2c3244"/><text x="223" y="327" fill="#a3a9b7" text-anchor="middle" font-size="11">4 moments</text>

    <rect x="44" y="352" width="372" height="116" rx="18" fill="#1c2030" stroke="#2c3244"/>
    <rect x="56" y="364" width="120" height="76" rx="10" fill="url(#v)"/>
    <text x="188" y="378" fill="#eef0f5" font-weight="600">Mail <tspan fill="#727887" font-weight="400">mar. 24/11 09:02</tspan></text>
    <text x="188" y="398" fill="#eef0f5" font-size="13.5" font-weight="600">Votre échéancier 2027</text>
    <text x="188" y="418" fill="#a3a9b7">…montant mensuel de votre</text>
    <text x="188" y="434" fill="#a3a9b7">contrat d'énergie…</text>
    <rect x="188" y="444" width="82" height="18" rx="9" fill="#9b59f6" fill-opacity="0.18"/><text x="229" y="457" fill="#b98bff" text-anchor="middle" font-size="11" font-weight="600">par le sens</text>

    <rect x="44" y="482" width="372" height="116" rx="18" fill="#1c2030" stroke="#2c3244"/>
    <rect x="56" y="494" width="120" height="76" rx="10" fill="url(#v)"/>
    <path d="M70 534 q8 -18 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#4cd38a" stroke-width="2.5"/>
    <text x="188" y="508" fill="#eef0f5" font-weight="600">Finder <tspan fill="#727887" font-weight="400">mer. 25/11 18:40</tspan></text>
    <text x="188" y="528" fill="#eef0f5" font-size="13.5" font-weight="600">Dit à voix haute</text>
    <text x="188" y="548" fill="#a3a9b7">« il faut que je paie la facture</text>
    <text x="188" y="564" fill="#a3a9b7">d'électricité avant vendredi »</text>
    <rect x="188" y="574" width="62" height="18" rx="9" fill="#2fb36b" fill-opacity="0.18"/><text x="219" y="587" fill="#4cd38a" text-anchor="middle" font-size="11" font-weight="600">entendu</text>
  </g>
  <!-- Les onglets -->
  <rect x="98" y="752" width="264" height="54" rx="27" fill="#1c2030" stroke="#2c3244"/>
  <rect x="104" y="758" width="124" height="42" rx="21" fill="#3d9bff"/>
  <text x="166" y="785" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Frise</text>
  <text x="296" y="785" font-size="15" font-weight="600" fill="#a3a9b7" text-anchor="middle">Demander</text>
</svg>
