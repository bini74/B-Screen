[package]
name = "bscreen"
description = "B-Screen : l'application et la commande bscreen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bscreen-core.workspace = true
bscreen-macos.workspace = true
bscreen-store.workspace = true
bscreen-api.workspace = true
bscreen-ui.workspace = true
gpui.workspace = true
futures.workspace = true
signal-hook = "0.4"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "sync"] }
ring = "0.17"
base64 = "0.22"
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
global-hotkey = "0.10"
