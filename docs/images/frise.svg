    <rect x="360" y="16" width="480" height="48" rx="24" fill="#1f2433" stroke="#3b4357"/>
    <circle cx="390" cy="40" r="8" fill="none" stroke="#9aa1b2" stroke-width="2.4"/>
    <line x1="396" y1="46" x2="402" y2="52" stroke="#9aa1b2" stroke-width="2.4" stroke-linecap="round"/>
    <text x="414" y="46" font-size="18" fill="#eef0f5">voiture rouge</text>
    <rect x="652" y="27" width="174" height="26" rx="13" fill="#0a84ff"/>
    <text x="739" y="45" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600">3 endroits · ↩ suivant</text>
